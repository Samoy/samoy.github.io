<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>InnoDB 数据页读取的缓存层次</title>
  <desc>InnoDB 查询先访问 Buffer Pool，未命中时走文件系统读取，可能命中操作系统 Page Cache，仍未命中才真正访问存储设备。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b91a1"/>
    </marker>
  </defs>

  <rect x="150" y="16" width="340" height="64" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="320" y="44" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">InnoDB 查询</text>
  <text x="320" y="66" text-anchor="middle" font-size="12" fill="#3f4552">需要读取数据页</text>
  <line x1="320" y1="80" x2="320" y2="108" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="150" y="112" width="340" height="64" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="2"/>
  <text x="320" y="140" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">Buffer Pool</text>
  <text x="320" y="162" text-anchor="middle" font-size="12" fill="#3f4552">InnoDB 管理的数据页缓存</text>
  <line x1="320" y1="176" x2="320" y2="204" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="336" y="178" width="64" height="24" rx="12" fill="#e8edfd"/>
  <text x="368" y="195" text-anchor="middle" font-size="12" fill="#171a21">未命中</text>

  <rect x="150" y="208" width="340" height="64" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="320" y="246" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">文件系统读取</text>
  <line x1="320" y1="272" x2="320" y2="300" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="150" y="304" width="340" height="64" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="2"/>
  <text x="320" y="332" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">操作系统 Page Cache</text>
  <text x="320" y="354" text-anchor="middle" font-size="12" fill="#3f4552">内核管理的文件页缓存</text>
  <line x1="320" y1="368" x2="320" y2="396" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="336" y="370" width="64" height="24" rx="12" fill="#e8edfd"/>
  <text x="368" y="387" text-anchor="middle" font-size="12" fill="#171a21">未命中</text>

  <rect x="150" y="400" width="340" height="64" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="320" y="428" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">存储设备</text>
  <text x="320" y="450" text-anchor="middle" font-size="12" fill="#3f4552">磁盘 / SSD</text>
</svg>