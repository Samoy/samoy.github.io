<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>普通 LRU 淘汰策略示意</title>
  <desc>LRU 链表头部是最近使用的页，尾部是最久未使用的页。加载新页 Page F 时插入头部，内存不足时淘汰尾部 Page E。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b91a1"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c93a2e"/>
    </marker>
  </defs>

  <!-- 新页 Page F -->
  <rect x="60" y="40" width="120" height="60" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="120" y="66" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">Page F</text>
  <text x="120" y="87" text-anchor="middle" font-size="12" fill="#3f4552">新加载</text>
  <line x1="120" y1="100" x2="120" y2="166" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="138" y="120" width="92" height="28" rx="14" fill="#e8edfd"/>
  <text x="184" y="139" text-anchor="middle" font-size="13" fill="#171a21">插入头部</text>

  <!-- LRU 链表 -->
  <rect x="60" y="170" width="110" height="64" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="115" y="208" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">Page A</text>
  <line x1="174" y1="202" x2="200" y2="202" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="205" y="170" width="110" height="64" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="260" y="208" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">Page B</text>
  <line x1="319" y1="202" x2="345" y2="202" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="350" y="170" width="110" height="64" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="405" y="208" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">Page C</text>
  <line x1="464" y1="202" x2="490" y2="202" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="495" y="170" width="110" height="64" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="550" y="208" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">Page D</text>
  <line x1="609" y1="202" x2="635" y2="202" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="640" y="170" width="110" height="64" rx="10" fill="#e8edfd" stroke="#c93a2e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="695" y="208" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">Page E</text>

  <!-- 方向标注 -->
  <rect x="70" y="250" width="90" height="26" rx="13" fill="#e8edfd"/>
  <text x="115" y="268" text-anchor="middle" font-size="14" fill="#171a21">最近使用</text>
  <rect x="552" y="250" width="90" height="26" rx="13" fill="#e8edfd"/>
  <text x="597" y="268" text-anchor="middle" font-size="14" fill="#171a21">最久未使用</text>

  <!-- 淘汰 -->
  <line x1="695" y1="234" x2="695" y2="306" stroke="#c93a2e" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="640" y="316" width="110" height="28" rx="14" fill="#e8edfd"/>
  <text x="695" y="335" text-anchor="middle" font-size="15" font-weight="600" fill="#b3271e">淘汰 Page E</text>

  <rect x="50" y="381" width="380" height="30" rx="15" fill="#e8edfd"/>
  <text x="240" y="401" text-anchor="middle" font-size="13" fill="#171a21">内存不足时：新页进入头部，最久未使用的尾部页被淘汰</text>
</svg>