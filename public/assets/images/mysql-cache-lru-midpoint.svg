<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>InnoDB 改进 LRU：中点插入策略</title>
  <desc>LRU 链表分为 New Sublist 热点区与 Old Sublist 冷数据区。新页从中点插入 Old 区头部，超过 innodb_old_blocks_time 后再次访问才晋升到 New 区，内存不足时从链表尾部淘汰。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b91a1"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c93a2e"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f54eb"/>
    </marker>
  </defs>

  <!-- 新页来源 -->
  <rect x="430" y="24" width="170" height="48" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="515" y="54" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">磁盘读取的新页</text>
  <line x1="515" y1="72" x2="515" y2="106" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="531" y="76" width="92" height="26" rx="13" fill="#e8edfd"/>
  <text x="577" y="94" text-anchor="middle" font-size="13" fill="#171a21">中点插入</text>

  <!-- LRU 容器 -->
  <rect x="40" y="110" width="720" height="140" rx="12" fill="none" stroke="#8b91a1" stroke-width="1.5"/>
  <line x1="494" y1="110" x2="494" y2="250" stroke="#8b91a1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 区域标签 -->
  <rect x="115" y="122" width="260" height="30" rx="15" fill="#e8edfd"/>
  <text x="245" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#171a21">New Sublist · 热点页（约 63%）</text>
  <rect x="496" y="122" width="256" height="30" rx="15" fill="#e8edfd"/>
  <text x="624" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#171a21">Old Sublist · 较冷页（约 37%）</text>

  <!-- New 区页面 -->
  <rect x="80" y="170" width="64" height="52" rx="8" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="112" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">A</text>
  <line x1="148" y1="196" x2="166" y2="196" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="170" y="170" width="64" height="52" rx="8" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="202" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">B</text>
  <line x1="238" y1="196" x2="256" y2="196" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="260" y="170" width="64" height="52" rx="8" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="292" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">C</text>
  <line x1="328" y1="196" x2="356" y2="196" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="385" y="202" text-anchor="middle" font-size="16" fill="#8b91a1">…</text>
  <line x1="408" y1="196" x2="516" y2="196" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Old 区页面 -->
  <rect x="520" y="170" width="64" height="52" rx="8" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="552" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">D</text>
  <line x1="588" y1="196" x2="600" y2="196" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="604" y="170" width="64" height="52" rx="8" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="636" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">E</text>
  <line x1="672" y1="196" x2="684" y2="196" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="688" y="170" width="64" height="52" rx="8" fill="#e8edfd" stroke="#c93a2e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="720" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">F</text>

  <!-- 淘汰 -->
  <line x1="760" y1="196" x2="794" y2="196" stroke="#c93a2e" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="752" y="163" width="46" height="24" rx="12" fill="#e8edfd"/>
  <text x="775" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#b3271e">淘汰</text>

  <!-- 晋升路径 -->
  <path d="M 560 250 C 560 298, 240 298, 240 250" fill="none" stroke="#2f54eb" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <rect x="225" y="284" width="350" height="30" rx="15" fill="#e8edfd"/>
  <text x="400" y="304" text-anchor="middle" font-size="13" fill="#171a21">超过 old_blocks_time 后再次访问 → 晋升到 New</text>

  <!-- 方向标注 -->
  <rect x="40" y="338" width="90" height="26" rx="13" fill="#e8edfd"/>
  <text x="85" y="356" text-anchor="middle" font-size="14" fill="#171a21">最近使用</text>
  <rect x="676" y="338" width="90" height="26" rx="13" fill="#e8edfd"/>
  <text x="721" y="356" text-anchor="middle" font-size="14" fill="#171a21">最久未使用</text>
  <rect x="230" y="382" width="340" height="30" rx="15" fill="#e8edfd"/>
  <text x="400" y="402" text-anchor="middle" font-size="13" fill="#171a21">内存不足时，优先淘汰 Old 区尾部的冷页</text>
</svg>