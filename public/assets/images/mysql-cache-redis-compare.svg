<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>无 Redis 与有 Redis 的请求路径对比</title>
  <desc>左侧无 Redis：每次请求都要经过应用服务访问 MySQL 和 Buffer Pool。右侧有 Redis：命中时直接返回，未命中才访问 MySQL，返回结果后回填 Redis。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b91a1"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f54eb"/>
    </marker>
  </defs>

  <!-- 分栏标题 -->
  <rect x="130" y="16" width="140" height="34" rx="17" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="200" y="39" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">无 Redis</text>
  <rect x="590" y="16" width="140" height="34" rx="17" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="660" y="39" text-anchor="middle" font-size="16" font-weight="600" fill="#171a21">有 Redis</text>
  <line x1="480" y1="56" x2="480" y2="520" stroke="#8b91a1" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 左列：无 Redis -->
  <rect x="110" y="70" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="200" y="99" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">客户端</text>
  <line x1="200" y1="116" x2="200" y2="156" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="110" y="160" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="200" y="189" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">应用服务</text>
  <line x1="200" y1="206" x2="200" y2="246" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="110" y="250" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="200" y="279" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">MySQL</text>
  <line x1="200" y1="296" x2="200" y2="336" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="110" y="340" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="200" y="369" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">Buffer Pool</text>
  <line x1="200" y1="386" x2="200" y2="426" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="110" y="430" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="200" y="459" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">返回结果</text>

  <!-- 右列：有 Redis -->
  <rect x="570" y="70" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="660" y="99" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">客户端</text>
  <line x1="660" y1="116" x2="660" y2="136" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="570" y="140" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="660" y="169" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">应用服务</text>
  <line x1="660" y1="186" x2="660" y2="206" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="570" y="210" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="2"/>
  <text x="660" y="239" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">Redis</text>

  <!-- 命中分支 -->
  <line x1="750" y1="233" x2="788" y2="233" stroke="#2f54eb" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <rect x="792" y="210" width="152" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="868" y="238" text-anchor="middle" font-size="14" font-weight="600" fill="#171a21">命中：直接返回</text>

  <!-- 未命中分支 -->
  <line x1="660" y1="256" x2="660" y2="296" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="676" y="262" width="64" height="24" rx="12" fill="#e8edfd"/>
  <text x="708" y="279" text-anchor="middle" font-size="12" fill="#171a21">未命中</text>

  <rect x="570" y="300" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="660" y="329" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">MySQL</text>
  <line x1="660" y1="346" x2="660" y2="366" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="570" y="370" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="660" y="399" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">Buffer Pool</text>
  <line x1="660" y1="416" x2="660" y2="436" stroke="#8b91a1" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="570" y="440" width="180" height="46" rx="10" fill="#e8edfd" stroke="#2f54eb" stroke-width="1.5"/>
  <text x="660" y="469" text-anchor="middle" font-size="15" font-weight="600" fill="#171a21">返回结果</text>

  <!-- 回填 Redis -->
  <path d="M 570 463 L 520 463 L 520 233 L 566 233" fill="none" stroke="#2f54eb" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <rect x="496" y="330" width="48" height="26" rx="13" fill="#e8edfd"/>
  <text x="520" y="348" text-anchor="middle" font-size="13" fill="#171a21">回填</text>
</svg>